version: "3.9"

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "${DB_PASSWORD}"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${DB_PASSWORD}", "-Q", "SELECT 1"]
      interval: 10s
      retries: 10

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:sqlserver://sqlserver:1433;databaseName=FactoryPulseAuth;encrypt=false"
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: "${DB_PASSWORD}"
      JWT_SECRET: "${JWT_SECRET}"
      JWT_EXPIRY_MS: "86400000"
    depends_on:
      sqlserver:
        condition: service_healthy

  inspection-service:
    build:
      context: ./inspection-service
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    environment:
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=FactoryPulseInspection;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True"
      Jwt__Secret: "${JWT_SECRET}"
      AuthService__BaseUrl: "http://auth-service:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

  reporting-service:
    build:
      context: ./reporting-service
      dockerfile: Dockerfile
    ports:
      - "5002:5002"
    environment:
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=FactoryPulseReporting;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True"
      Jwt__Secret: "${JWT_SECRET}"
      InspectionService__BaseUrl: "http://inspection-service:5001"
    depends_on:
      sqlserver:
        condition: service_healthy

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      Jwt__Secret: "${JWT_SECRET}"
      Services__Auth: "http://auth-service:8080"
      Services__Inspection: "http://inspection-service:5001"
      Services__Reporting: "http://reporting-service:5002"
    depends_on:
      - auth-service
      - inspection-service
      - reporting-service

volumes:
  sqldata:
